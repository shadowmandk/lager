# Kører alle tests mod SQLite (som lokalt) og MySQL 8.4 (som på serveren), hver gang der skubbes kode.
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, mysql]

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: lager_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DB_CONNECTION: ${{ matrix.database }}
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: ${{ matrix.database == 'mysql' && 'lager_test' || ':memory:' }}
      DB_USERNAME: root
      DB_PASSWORD: test
      DB_COLLATION: utf8mb4_danish_ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, pdo_mysql, mbstring, intl, zip
          coverage: none

      - name: Composer
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Miljø
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Tests
        run: php vendor/bin/pest
